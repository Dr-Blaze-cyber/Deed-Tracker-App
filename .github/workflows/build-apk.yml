name: Build Android Release

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────
      # Checkout
      # ─────────────────────────────
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ─────────────────────────────
      # Node
      # ─────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # ─────────────────────────────
      # Read version from package.json
      # ─────────────────────────────
      - name: Read App Version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            echo "Version must be in format X.Y.Z"
            exit 1
          fi

          VERSION_CODE=$(node -e "
            const [major, minor, patch] = '$VERSION'.split('.').map(Number);
            const code = major * 10000 + minor * 100 + patch;
            console.log(code);
          ")

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"

          echo "App version: $VERSION"
          echo "Android versionCode: $VERSION_CODE"

      # ─────────────────────────────
      # Check whether this version
      # has already been released
      # ─────────────────────────────
      - name: Check Existing Release
        id: check_release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG does not exist."
          fi

      # ─────────────────────────────
      # Stop if version already exists
      # ─────────────────────────────
      - name: Stop - Release Already Exists
        if: steps.check_release.outputs.exists == 'true'
        run: |
          echo "Version ${{ steps.version.outputs.VERSION }} is already released."
          echo "Increase the version in package.json before creating another release."
          exit 0

      # ─────────────────────────────
      # Install dependencies
      # ─────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ─────────────────────────────
      # Setup Java
      # ─────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ─────────────────────────────
      # Create signing keystore
      # ─────────────────────────────
      - name: Create keystore
        shell: bash
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/deedtracker-release-key.jks

      # ─────────────────────────────
      # Create signing properties
      # ─────────────────────────────
      - name: Create keystore properties
        shell: bash
        run: |
          echo "storeFile=deedtracker-release-key.jks" > android/keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/keystore.properties

      # ─────────────────────────────
      # Capacitor Sync
      # ─────────────────────────────
      - name: Capacitor Sync
        run: npx cap sync android

      # ─────────────────────────────
      # Build APK + AAB
      # ─────────────────────────────
      - name: Build Release
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.VERSION }}
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
        run: |
          cd android

          chmod +x gradlew

          ./gradlew \
            assembleRelease \
            bundleRelease \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE"

      # ─────────────────────────────
      # Verify outputs
      # ─────────────────────────────
      - name: Verify Build Outputs
        shell: bash
        run: |
          echo "=== APK files ==="
          find android/app/build/outputs/apk/release -type f

          echo ""
          echo "=== AAB files ==="
          find android/app/build/outputs/bundle/release -type f

          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Signed APK was not created."
            exit 1
          fi

          if [ ! -f "$AAB" ]; then
            echo "ERROR: AAB was not created."
            exit 1
          fi

          echo ""
          echo "Build outputs verified successfully."

      # ─────────────────────────────
      # Rename files
      # ─────────────────────────────
      - name: Rename Release Files
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mv \
            android/app/build/outputs/apk/release/app-release.apk \
            "android/app/build/outputs/apk/release/Deed-Tracker-v${VERSION}.apk"

          mv \
            android/app/build/outputs/bundle/release/app-release.aab \
            "android/app/build/outputs/bundle/release/Deed-Tracker-v${VERSION}.aab"

      # ─────────────────────────────
      # Upload workflow artifact
      # ─────────────────────────────
      - name: Upload APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: Deed-Tracker-v${{ steps.version.outputs.VERSION }}
          path: |
            android/app/build/outputs/apk/release/Deed-Tracker-v${{ steps.version.outputs.VERSION }}.apk
            android/app/build/outputs/bundle/release/Deed-Tracker-v${{ steps.version.outputs.VERSION }}.aab

      # ─────────────────────────────
      # Create GitHub Release
      # ─────────────────────────────
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          TAG="v$VERSION"

          gh release create "$TAG" \
            "android/app/build/outputs/apk/release/Deed-Tracker-v${VERSION}.apk" \
            "android/app/build/outputs/bundle/release/Deed-Tracker-v${VERSION}.aab" \
            --title "Deed Tracker v${VERSION}" \
            --generate-notes
